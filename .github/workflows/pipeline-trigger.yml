name: Trigger Production Pipeline

# Explicitly starts the CodePipeline execution on every push to main.
# Belt-and-suspenders alongside the CodeConnections trigger: the connections-
# based webhook mechanism (CodeConnections → CodePipeline V1) can silently
# miss pushes when the connection is replaced or the GitHub App webhook
# registration is stale. This workflow ensures the pipeline always starts.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  trigger:
    name: Start CodePipeline execution
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start pipeline execution
        run: |
          aws codepipeline start-pipeline-execution \
            --name auspex40k-pipeline \
            --query 'pipelineExecutionId' \
            --output text
